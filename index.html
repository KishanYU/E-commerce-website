<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroMartart Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>ElectroMart</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Offers</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <h2>Latest Electronics Collection</h2>
        <p>Buy smart gadgets at amazing prices</p>
    </section>
    <section class="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Wireless Headphones">
            <h3>Wireless Headphones</h3>
            <p>₹1499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1546868871-af0de0ae72be?w=500" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>₹2499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500" alt="Bluetooth Speaker">
            <h3>Bluetooth Speaker</h3>
            <p>₹1999</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1527814050087-3793815479db?w=500" alt="Gaming Mouse">
            <h3>Gaming Mouse</h3>
            <p>₹1999</p>
            <button>Buy Now</button>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 ElectroMartart Store | Designed by Kishan</p>
    </footer>
</body>

</html>
