<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub Store</title>

</head>

<body>
    <header>
        <h1>StyleHub</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Offers</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <h2>Trendy Fashion Collection</h2>
        <p>Shop the latest styles at affordable prices</p>
    </section>
    <section class="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="T-Shirt">
            <h3>Casual T-Shirt</h3>
            <p>₹499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500" alt="Jeans">
            <h3>Blue Jeans</h3>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
            <h3>Running Shoes</h3>
            <p>₹1499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=500" alt="Jacket">
            <h3>Winter Jacket</h3>
            <p>₹1999</p>
            <button>Buy Now</button>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 StyleHub Store | Designed by Kishan</p>
    </footer>

</html>
